<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17212b">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Голубь</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css?v=12">
</head>
<body>
<div id="auth" class="auth hidden"></div>
<div id="app" class="app hidden">
  <div class="drawer-backdrop" id="backdrop"></div>

  <aside class="drawer" id="drawer">
    <div class="drawer-user">
      <div class="du-row">
        <div class="du-avatar" id="du-avatar"></div>
        <div class="du-info">
          <div class="du-name" id="du-name"></div>
          <div class="du-user" id="du-user"></div>
        </div>
      </div>
    </div>
    <nav class="drawer-nav" id="drawer-nav">
      <button data-act="profile"><span class="dn-ic">👤</span>Мой профиль</button>
      <button data-act="folders"><span class="dn-ic">📁</span>Папки</button>
      <button data-act="about"><span class="dn-ic">ℹ</span>О мессенджере</button>
      <button data-act="settings"><span class="dn-ic">⚙</span>Настройки</button>
      <hr>
      <button data-act="logout" class="danger-nav"><span class="dn-ic">↪</span>Выйти</button>
    </nav>
  </aside>

  <section class="screen active" data-screen="chats">
    <header class="topbar">
      <button class="tb-btn" id="btn-menu">☰</button>
      <div class="search-wrap">
        <span class="search-ic">🔍</span>
        <input id="q" placeholder="Поиск" autocomplete="off">
      </div>
    </header>
    <div class="folders-tabs" id="folders-tabs"></div>
    <div class="chat-list" id="chat-list"></div>
    <button class="fab" id="btn-new" title="Новый чат">✎</button>
  </section>

  <section class="screen" data-screen="chat">
    <header class="topbar">
      <button class="tb-btn back-btn" id="chat-back">←</button>
      <div class="chat-title-wrap" id="chat-title-wrap">
        <div class="chat-avatar" id="chat-avatar"></div>
        <div class="chat-titles">
          <div class="chat-name" id="chat-name"></div>
          <div class="chat-sub" id="chat-sub"></div>
        </div>
      </div>
      <button class="tb-btn" id="btn-call" title="Позвонить">📞</button>
      <button class="tb-btn" id="btn-search-msg" title="Поиск">🔍</button>
      <button class="tb-btn" id="chat-menu-btn">⋮</button>
    </header>
    <div class="pinned-bar hidden" id="pinned-bar"></div>
    <div class="messages" id="messages"></div>
    <div class="reply-preview-bar hidden" id="reply-bar">
      <div class="rp-body">
        <div class="rp-name" id="reply-name"></div>
        <div class="rp-text" id="reply-text"></div>
      </div>
      <button class="rp-close" id="reply-close">✕</button>
    </div>
    <form class="composer" id="composer">
      <button type="button" class="attach" id="btn-poll" title="Создать опрос" aria-label="Опрос">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16M7 20V10M12 20V4M17 20v-7"/></svg>
      </button>
      <button type="button" class="attach" id="btn-stickers" title="Стикеры" aria-label="Стикеры">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="9" cy="10" r="1.3" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="10" r="1.3" fill="currentColor" stroke="none"/>
          <path d="M8 14 Q12 18 16 14" stroke-linecap="round"/>
        </svg>
      </button>
      <label class="attach" title="Прикрепить" aria-label="Прикрепить файл">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
        <input type="file" id="file" multiple hidden>
      </label>
      <input id="msg" placeholder="Сообщение" autocomplete="off" enterkeyhint="send">
      <button type="button" class="mic-btn" id="btn-voice" aria-label="Голосовое">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>
      </button>
      <button class="send-btn" type="submit" aria-label="Отправить">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </form>
  </section>

  <section class="screen overlay" data-screen="search">
    <header class="topbar">
      <button class="tb-btn" data-back>←</button>
      <div class="search-wrap"><span class="search-ic">🔍</span>
        <input id="msg-search-q" placeholder="Поиск по сообщениям" autocomplete="off"></div>
    </header>
    <div class="scroll" id="search-results"></div>
  </section>

  <section class="screen overlay" data-screen="settings">
    <header class="topbar"><button class="tb-btn" data-back>←</button>
      <div class="tb-title">Настройки</div><div class="tb-spacer"></div></header>
    <div class="scroll" id="settings-body"></div>
  </section>

  <section class="screen overlay" data-screen="profile">
    <header class="topbar"><button class="tb-btn" data-back>←</button>
      <div class="tb-title">Изменить профиль</div>
      <button class="tb-btn accent" id="prof-save">✓</button></header>
    <div class="scroll" id="profile-body"></div>
  </section>

  <section class="screen overlay" data-screen="folders">
    <header class="topbar"><button class="tb-btn" data-back>←</button>
      <div class="tb-title">Папки</div>
      <button class="tb-btn accent" id="folder-add">＋</button></header>
    <div class="scroll" id="folders-body"></div>
  </section>

  <section class="screen overlay" data-screen="about">
    <header class="topbar"><button class="tb-btn" data-back>←</button>
      <div class="tb-title">О мессенджере</div><div class="tb-spacer"></div></header>
    <div class="scroll" id="about-body"></div>
  </section>

  <section class="screen overlay" data-screen="info">
    <header class="topbar"><button class="tb-btn" data-back>←</button>
      <div class="tb-title">Информация</div><div class="tb-spacer"></div></header>
    <div class="scroll" id="info-body"></div>
  </section>

  <div id="call-screen" class="call-screen hidden">
    <div class="call-status" id="call-status">Аудиозвонок…</div>
    <div class="call-actions">
      <button id="call-mute" class="call-btn" title="Микрофон">🎤</button>
      <button id="call-end" class="call-btn danger" title="Завершить">✕</button>
    </div>
    <audio id="call-remote" autoplay></audio>
  </div>

  <div id="invite-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title">Вступить в чат?</div>
      <div id="invite-info" class="muted" style="text-align:center"></div>
      <button class="primary-btn" id="invite-accept">Вступить</button>
      <button class="primary-btn" id="invite-cancel" style="background:var(--tg-input-bg);color:var(--tg-text)">Отмена</button>
    </div>
  </div>
</div>
<script src="/static/app.js?v=12"></script>
</body>
                                                                </html>
